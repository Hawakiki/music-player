<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Music Player</title>
    <script>
      // 첫 화면이 깜빡이지 않도록 React보다 먼저 테마를 적용한다. 규칙은 src/lib/theme.ts와 같다.
      ;(function () {
        var theme = null
        try {
          theme = localStorage.getItem('music-player:theme')
        } catch (e) {}
        var dark =
          theme === 'black' ||
          (theme !== 'white' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
